<!DOCTYPE html>
<html lang="en">
    <style>
        h1,h2,h3,h4{text-align: center;}
    </style>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Weather Widget">
        <meta name="keywords" content="Weather Widget">
        <meta name="author" content="Lia Roeback">
        <meta property="og:title" content="Weather Widget">
        <meta property="og:description" content="Shows a 5 day forcast for x city">
        <meta property="og:type" content="website">
        <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmls='http://www.w3.org/2000/svg' viewbox= '0>">
        <link rel="icon" href="weatherImage.png" type="image/png">
        <link rel="stylesheet" href="Weather.css">
        <title>Weather Widget</title>
    </head>
    <body>
        <header role="banner">
            <section class="container">
                <h1><img src="weatherImageWithText.png" class="headerImage" height="500rem"></h1>
            </section>
        </header>
        <main id="main-content" role="main">
            <h1>
                <button id="oneDay" class="oneDay">1 Day</button>
                <button id="fiveDay" class="fiveDay">5 Day</button>
            </h1>
            <h2>
                <p>Enter A City</p>
                <h3>
                    <textarea class="city" id="city"></textarea>
                    <button id="citySearchButton" class="citySearchButton">Search</button>
                </h3>
            </h2>
            
        </main>
    </body>
    <footer>Copyright ©2025 by Lia Roeback</footer>
    <script src="Weather.js"></script>
</html>
